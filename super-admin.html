<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - Votura Studio</title>
  <style>
    :root {
      --bg: #f4f4f0;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --accent: #2563eb;
      --danger: #dc2626;
      --border: 2px solid #1a1a1a;
      --shadow: 4px 4px 0px #1a1a1a;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header {
      background: #facc15;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }
    header h1 { margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
    header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.8; }

    .card {
      background: var(--card-bg);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 10px;
      border: var(--border);
      font-size: 14px;
      outline: none;
      background: #fafafa;
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: bold;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 12px 20px;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #1a1a1a; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: var(--border); padding: 10px; text-align: left; font-size: 14px; vertical-align: middle; }
    th { background: #e2e8f0; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-active { background: #bbf7d0; color: #166534; border: 1px solid #166534; }
    .badge-locked { background: #fecaca; color: #991b1b; border: 1px solid #991b1b; }
    
    .btn-sm { padding: 5px 10px; font-size: 12px; box-shadow: 2px 2px 0px #1a1a1a; margin-right: 4px; text-decoration: none; display: inline-block; }
    .btn-open { background: #3b82f6; color: white; }
    .btn-admin { background: #8b5cf6; color: white; }
    .btn-toggle { background: #f59e0b; color: white; }
    .btn-delete { background: var(--danger); color: white; }

    /* CUSTOM NEO-BRUTALISM MODAL POPUP */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center;
      z-index: 999;
    }
    .modal-box {
      background: white; border: 3px solid #1a1a1a; box-shadow: 6px 6px 0px #1a1a1a;
      width: 90%; max-width: 400px; padding: 24px; text-align: center;
    }
    .modal-box h3 { margin-top: 0; text-transform: uppercase; font-size: 18px; }
    .modal-box p { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-btn-confirm { background: var(--accent); color: white; }
    .modal-btn-cancel { background: #9ca3af; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Votura Studio - Dashboard Super Admin</h1>
      <p>Manajemen Client Multi-Tenant (Virtual Photobooth & Wedding Invitation)</p>
    </header>

    <!-- FORM BUAT EVENT BARU -->
    <div class="card">
      <h3>Tambah Event / Klien Baru</h3>
      <form id="create-event-form">
        <div class="form-group">
          <label for="event-id">ID Event (Unik, Tanpa Spasi/Simbol):</label>
          <input type="text" id="event-id" placeholder="contoh: nikah-amel-riyan atau ultah-budi" required>
        </div>
        <div class="form-group">
          <label for="event-name">Nama Event / Client:</label>
          <input type="text" id="event-name" placeholder="contoh: Pernikahan Amelia & Riyan" required>
        </div>
        <div class="form-group">
          <label for="event-type">Jenis Produk / Layanan:</label>
          <select id="event-type">
            <option value="wedding">Votura Wedding Invitation</option>
            <option value="photobooth">Votura Virtual Photobooth</option>
          </select>
        </div>
        <button type="submit">Simpan Event Baru</button>
      </form>
    </div>

    <!-- DAFTAR EVENT -->
    <div class="card">
      <h3>Daftar Event Tersedia</h3>
      <table>
        <thead>
          <tr>
            <th>ID Event</th>
            <th>Nama Event</th>
            <th>Tipe</th>
            <th>Status</th>
            <th>Aksi & Link Access</th>
          </tr>
        </thead>
        <tbody id="event-table-body">
          <tr>
            <td colspan="5" style="text-align: center;">Memuat data event...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- CUSTOM MODAL HTML -->
  <div class="modal-overlay" id="custom-modal">
    <div class="modal-box">
      <h3 id="modal-title">Notifikasi</h3>
      <p id="modal-message">Pesan notifikasi...</p>
      <div class="modal-actions" id="modal-actions">
        <button class="btn-sm modal-btn-confirm" onclick="closeModal()">OK</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    // HELPER: Modal Custom UI
    function showModal(title, message, isConfirm = false, onConfirm = null) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      const actionsEl = document.getElementById('modal-actions');
      
      if (isConfirm) {
        actionsEl.innerHTML = `
          <button class="btn-sm modal-btn-confirm" id="confirm-btn">Ya, Hapus</button>
          <button class="btn-sm modal-btn-cancel" onclick="closeModal()">Batal</button>
        `;
        document.getElementById('confirm-btn').onclick = () => {
          closeModal();
          if (onConfirm) onConfirm();
        };
      } else {
        actionsEl.innerHTML = `<button class="btn-sm modal-btn-confirm" onclick="closeModal()">OK</button>`;
      }
      
      document.getElementById('custom-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }
