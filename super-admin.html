<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - Votura Studio</title>
  <style>
    :root {
      --bg: #f4f4f0;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --accent: #2563eb;
      --danger: #dc2626;
      --border: 2px solid #1a1a1a;
      --shadow: 4px 4px 0px #1a1a1a;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header {
      background: #facc15;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }
    header h1 { margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
    header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.8; }

    .card {
      background: var(--card-bg);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 10px;
      border: var(--border);
      font-size: 14px;
      outline: none;
      background: #fafafa;
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: bold;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 12px 20px;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #1a1a1a; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: var(--border); padding: 10px; text-align: left; font-size: 14px; }
    th { background: #e2e8f0; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-active { background: #bbf7d0; color: #166534; border: 1px solid #166534; }
    .badge-locked { background: #fecaca; color: #991b1b; border: 1px solid #991b1b; }
    
    .btn-sm { padding: 4px 8px; font-size: 12px; box-shadow: 2px 2px 0px #1a1a1a; margin-right: 4px; }
    .btn-toggle { background: #f59e0b; color: white; }
    .btn-delete { background: var(--danger); color: white; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Votura Studio - Dashboard Super Admin</h1>
      <p>Manajemen Client Multi-Tenant (Virtual Photobooth & Wedding Invitation)</p>
    </header>

    <!-- FORM BUAT EVENT BARU -->
    <div class="card">
      <h3>Tambah Event / Klien Baru</h3>
      <form id="create-event-form">
        <div class="form-group">
          <label for="event-id">ID Event (Unik, Tanpa Spasi/Simbol):</label>
          <input type="text" id="event-id" placeholder="contoh: nikah-amel-riyan atau photobooth-ultah-budi" required>
        </div>
        <div class="form-group">
          <label for="event-name">Nama Event / Client:</label>
          <input type="text" id="event-name" placeholder="contoh: Pernikahan Amelia & Riyan" required>
        </div>
        <div class="form-group">
          <label for="event-type">Jenis Produk / Layanan:</label>
          <select id="event-type">
            <option value="wedding">Votura Wedding Invitation</option>
            <option value="photobooth">Votura Virtual Photobooth</option>
          </select>
        </div>
        <button type="submit">Simpan Event Baru</button>
      </form>
    </div>

    <!-- DAFTAR EVENT -->
    <div class="card">
      <h3>Daftar Event Tersedia</h3>
      <table>
        <thead>
          <tr>
            <th>ID Event</th>
            <th>Nama Event</th>
            <th>Tipe</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="event-table-body">
          <tr>
            <td colspan="5" style="text-align: center;">Memuat data event...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- FIREBASE SDK (COMPAT VERSION FOR EASY HTML USE) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // ==========================================
    // 1. TEMPEL KODE FIREBASE CONFIG KAMU DI SINI
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAvCF0gKmZ9n28JltwoOS5QqcnlHhGz4Ww",
      authDomain: "votura-studio.firebaseapp.com",
      projectId: "votura-studio",
      storageBucket: "votura-studio.firebasestorage.app",
      messagingSenderId: "PASTE_SENDER_ID_DI_SINI",
      appId: "PASTE_APP_ID_DI_SINI"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Elements
    const form = document.getElementById('create-event-form');
    const tableBody = document.getElementById('event-table-body');

    // READ: Load Events dari Firestore
    function loadEvents() {
      db.collection("events").onSnapshot((snapshot) => {
        tableBody.innerHTML = "";

        if (snapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada event yang dibuat.</td></tr>`;
          return;
        }

        snapshot.forEach((doc) => {
          const data = doc.data();
          const docId = doc.id;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${docId}</strong></td>
            <td>${data.name}</td>
            <td>${data.type.toUpperCase()}</td>
            <td>
              <span class="badge ${data.status === 'active' ? 'badge-active' : 'badge-locked'}">
                ${data.status}
              </span>
            </td>
            <td>
              <button class="btn-sm btn-toggle" onclick="toggleStatus('${docId}', '${data.status}')">
                ${data.status === 'active' ? 'Lock' : 'Unlock'}
              </button>
              <button class="btn-sm btn-delete" onclick="deleteEvent('${docId}')">Delete</button>
            </td>
          `;
          tableBody.appendChild(tr);
        });
      });
    }

    // CREATE: Tambah Event Baru
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const rawId = document.getElementById('event-id').value.trim().toLowerCase();
      const eventId = rawId.replace(/[^a-z0-9-]/g, '-'); // Sanitize ID
      const name = document.getElementById('event-name').value;
      const type = document.getElementById('event-type').value;

      db.collection("events").doc(eventId).set({
        name: name,
        type: type,
        status: "active",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        alert("Event berhasil ditambahkan!");
        form.reset();
      })
      .catch((error) => {
        alert("Gagal menambahkan event: " + error.message);
      });
    });

    // UPDATE: Lock / Unlock Event
    window.toggleStatus = function(id, currentStatus) {
      const newStatus = currentStatus === 'active' ? 'locked' : 'active';
      db.collection("events").doc(id).update({
        status: newStatus
      });
    };

    // DELETE: Hapus Event
    window.deleteEvent = function(id) {
      if (confirm(`Yakin ingin menghapus event ID: "${id}"?`)) {
        db.collection("events").doc(id).delete();
      }
    };

    // Jalankan Load Events pertama kali
    loadEvents();
  </script>
</body>
</html>
